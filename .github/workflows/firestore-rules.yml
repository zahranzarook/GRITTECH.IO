# Publishes firestore.rules. Manual only (Actions tab -> Run workflow):
# the current deploy key can't publish rules, so rules are published in the Firebase console for now.
name: Deploy Firestore rules
on:
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Deploy rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project grittech-io --non-interactive
