# Deploys the live site whenever main changes.
name: Deploy live on merge
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Media CDN (Cloudflare R2): upload images/videos, then build with links pointing at it.
      # Skipped until the MEDIA_BASE variable and R2_* secrets are added in GitHub settings.
      - name: Upload media to R2
        if: ${{ vars.MEDIA_BASE != '' }}
        run: node tools/sync-media.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - run: npm run build
        env:
          MEDIA_BASE: ${{ vars.MEDIA_BASE }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: grittech-io
          channelId: live
